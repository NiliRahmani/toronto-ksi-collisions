name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The live-extract tests skip when data/ksi_raw.csv is absent, which it is on a
# clean checkout. That is deliberate: this job stays hermetic and fast, and the
# real download path is exercised weekly by refresh.yml instead. A test suite
# that fails because a government portal was briefly down is a test suite people
# learn to ignore.
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        run: pytest -q -rs
